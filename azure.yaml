# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.27.1"
extensions:
  azure.ai.agents: ">=1.0.0-beta.9"
name: foundry-realestate-agent
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        model:
          format: OpenAI
          name: ${AZURE_AI_MODEL_NAME}
          version: ${AZURE_AI_MODEL_VERSION}
        sku:
          name: GlobalStandard
          capacity: 10
  foundry-realestate-agent:
    host: azure.ai.agent
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: src/realestate_agent/main.py
    uses:
      - ai-project
    kind: hosted
    name: foundry-realestate-agent
    description: Multi-agent real-estate research and deterministic investment analysis.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      TOOLBOX_NAME: realestate-data
    container:
      resources:
        cpu: "1"
        memory: 2Gi
infra:
  provider: microsoft.foundry
