[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-realestate-agent"
version = "0.1.0"
description = "Microsoft Agent Framework real-estate analysis hosted agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-foundry",
    "agent-framework-foundry-hosting>=1.0.0b260813",
    "agent-framework-orchestrations>=1.1.1",
    "azure-identity",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
